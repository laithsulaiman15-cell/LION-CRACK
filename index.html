
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LION CRACK | PS4 Host</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="hero">
        <div class="content">
            <h1>LION CRACK</h1>
            <p>PS4 EXPLOIT • RESEARCH • HOST</p>

            <button id="activateBtn">ACTIVATE</button>

            <div id="status">SYSTEM READY</div>

            <section class="firmware-check">
                <h2>FIRMWARE DETECTOR</h2>
                <p>Enter your PS4 system software version</p>

                <input
                    id="firmwareInput"
                    type="text"
                    placeholder="Example: 14.02"
                >

                <button id="checkBtn">CHECK FIRMWARE</button>

                <div id="firmwareResult">
                    WAITING FOR INPUT
                </div>
            </section>

            <footer>
                A LIONS GAME STUDIOS PROJECT
            </footer>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
