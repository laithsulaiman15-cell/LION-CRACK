
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LION CRACK | Console Research Host</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="hero">
        <div class="content">

            <section class="firmware-check">
                <h2>DEVICE DETECTION</h2>
                <div id="deviceResult">DETECTING DEVICE...</div>
                <div id="browserResult"></div>
            </section>

            <div id="status">SYSTEM READY</div>

            <section class="firmware-check">
                <h2>SYSTEM VERIFICATION</h2>

                <div id="systemResult">
                    WAITING FOR DEVICE DETECTION
                </div>

                <label for="firmwareInput">
                    System Software Version
                </label>

                <input
                    id="firmwareInput"
                    type="text"
                    placeholder="Example: 14.22"
                >

                <button id="checkBtn" type="button">
                    CHECK SYSTEM
                </button>

                <div id="firmwareResult">
                    WAITING FOR VERIFICATION
                </div>
            </section>

            <section class="kernel-section">
                <h2>PS4 KERNEL</h2>
                <p>Kernel 14.02 Research File</p>

                <a
                    href="https://drive.google.com/uc?export=download&id=1MmE750py3kszHeqvpVFvaOYhPcvy-2-R"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    DOWNLOAD KERNEL FILE
                </a>

                <p>STATUS: RESEARCH FILE - NOT VERIFIED</p>
            </section>

            <footer>
                A LIONS GAME STUDIOS PROJECT
            </footer>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
